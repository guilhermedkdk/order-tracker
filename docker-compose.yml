# The whole system for whoever has only Docker: `docker compose up --build`, then
# http://localhost:8081 (app) and http://localhost:8081/swagger-ui.html (API docs).
# For development, run the API and the front directly instead (README).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_tracker
      POSTGRES_USER: order_tracker
      POSTGRES_PASSWORD: order_tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_tracker -d order_tracker"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_tracker
      SPRING_DATASOURCE_USERNAME: order_tracker
      SPRING_DATASOURCE_PASSWORD: order_tracker
      # nginx in front sets X-Forwarded-*; this makes the API docs show the browser's address.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres-data:
