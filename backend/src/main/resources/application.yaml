spring:
  application:
    name: order-tracker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth:
    # Production sets APP_AUTH_JWT_SECRET; blank uses a random key per run.
    jwt-secret: ''
    session-ttl: 8h
    cookie-secure: false
