server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin for the API keeps the session cookie first-party (docs/DECISIONS.md).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Live updates stream from the API; buffering would hold them back.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Vite puts a content hash in every asset name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes such as /pedidos/novo all serve the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
